<base target="_top">

<title>Karen's Daily Checklist</title>

<style>
  :root {
    --bg:#fdf9f4; --paper:#fff; --ink:#2a1f14; --muted:#8a7a6e; --accent:#c4622d;
    --accent-light:#fdf0e8; --green:#2d6b4a; --green-light:#e8f4ee; --warm:#e8ddd0;
    --warm2:#f5efe8; --gold:#c49a2d; --check-done:#e8f4ee; --text-done:#a0b8a8;
    --shadow:0 2px 16px rgba(42,31,20,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;padding:0 0 80px;}
  .top-header{background:var(--ink);padding:28px 24px 24px;text-align:center;position:relative;overflow:hidden;}
  .top-header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(196,98,45,0.18) 0%,transparent 60%),radial-gradient(ellipse at 70% 50%,rgba(196,154,45,0.12) 0%,transparent 60%);}
  .top-header .greeting{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,4vw,2.4rem);color:#fff;position:relative;margin-bottom:6px;}
  .top-header .greeting em{font-style:italic;color:#f0c090;}
  .top-header .sub{font-size:0.78rem;color:rgba(255,255,255,0.55);position:relative;letter-spacing:0.04em;}
  .sync-badge{position:fixed;top:10px;right:10px;z-index:50;font-size:0.6rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,0.15);color:#fff;transition:all .3s;backdrop-filter:blur(4px);}
  .sync-badge.saving{background:#c49a2d;color:#fff;}
  .sync-badge.saved{background:#2d6b4a;color:#fff;}
  .sync-badge.error{background:#b23030;color:#fff;}
  .sync-badge.offline{background:rgba(120,110,100,0.6);color:#fff;}
  .day-selector{display:flex;gap:0;background:var(--warm2);border-bottom:2px solid var(--warm);overflow-x:auto;scrollbar-width:none;}
  .day-selector::-webkit-scrollbar{display:none;}
  .day-btn{flex:1;min-width:70px;padding:14px 8px 12px;border:none;background:transparent;cursor:pointer;font-family:'Nunito',sans-serif;font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all 0.2s;position:relative;}
  .day-btn .day-name{display:block;margin-bottom:3px;}
  .day-btn .day-progress{display:block;font-size:0.58rem;font-weight:600;color:var(--muted);letter-spacing:0;}
  .day-btn:hover{color:var(--accent);background:var(--accent-light);}
  .day-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--paper);}
  .content{max-width:680px;margin:0 auto;padding:24px 16px;}
  .progress-section{background:var(--paper);border-radius:14px;padding:18px 20px;margin-bottom:20px;box-shadow:var(--shadow);border:1px solid var(--warm);}
  .progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .progress-label{font-size:0.72rem;font-weight:700;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}
  .progress-count{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--accent);}
  .progress-bar-wrap{background:var(--warm);border-radius:8px;height:8px;overflow:hidden;}
  .progress-bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width 0.5s cubic-bezier(0.4,0,0.2,1);width:0%;}
  .encouragement{font-size:0.72rem;color:var(--green);margin-top:8px;font-weight:600;min-height:18px;}
  .section-group{margin-bottom:20px;}
  .section-title{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .section-title .s-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;}
  .section-title .s-label{font-size:0.65rem;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;}
  .section-title .s-time{font-size:0.65rem;color:var(--muted);font-weight:600;margin-left:auto;}
  .s-sleep .s-icon{background:#edf0f8;}.s-sleep .s-label{color:#3a5080;}
  .s-health .s-icon{background:var(--green-light);}.s-health .s-label{color:var(--green);}
  .s-drive .s-icon{background:#fdf0e8;}.s-drive .s-label{color:#a05020;}
  .s-deepwork .s-icon{background:#e8eef8;}.s-deepwork .s-label{color:#2a4a80;}
  .s-ops .s-icon{background:#fce8e8;}.s-ops .s-label{color:#8b2020;}
  .s-admin .s-icon{background:#f0ebf8;}.s-admin .s-label{color:#5c3a8b;}
  .s-coaching .s-icon{background:#fef3e2;}.s-coaching .s-label{color:#92500a;}
  .s-family .s-icon{background:#fff5f8;}.s-family .s-label{color:#c43d5c;}
  .s-shutdown .s-icon{background:#f0ede8;}.s-shutdown .s-label{color:#5a4a3a;}
  .checklist{background:var(--paper);border-radius:12px;border:1px solid var(--warm);overflow:hidden;box-shadow:var(--shadow);}
  .check-item{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-bottom:1px solid var(--warm2);cursor:pointer;transition:background 0.15s;user-select:none;}
  .check-item:last-child{border-bottom:none;}
  .check-item:hover{background:var(--warm2);}
  .check-item.done{background:var(--check-done);}
  .checkbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--warm);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;background:var(--paper);}
  .check-item.done .checkbox{background:var(--green);border-color:var(--green);}
  .checkbox-check{color:#fff;font-size:0.7rem;font-weight:900;opacity:0;transform:scale(0);transition:all 0.2s cubic-bezier(0.175,0.885,0.32,1.275);}
  .check-item.done .checkbox-check{opacity:1;transform:scale(1);}
  .check-content{flex:1;}
  .check-time{font-size:0.6rem;font-weight:700;color:var(--accent);letter-spacing:0.08em;display:block;margin-bottom:2px;}
  .check-title{font-size:0.76rem;font-weight:600;line-height:1.4;}
  .check-item.done .check-title{color:var(--text-done);text-decoration:line-through;text-decoration-color:var(--text-done);}
  .check-note{font-size:0.63rem;color:var(--muted);line-height:1.45;margin-top:3px;}
  .check-item.done .check-note{color:#c0c8c0;}
  .check-tag{display:inline-block;font-size:0.55rem;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-right:5px;margin-bottom:3px;vertical-align:middle;}
  .tag-biz1{background:#fce8d0;color:#8b3a0a;}.tag-biz2{background:#d0ece4;color:#0f5c40;}
  .tag-health{background:var(--green-light);color:var(--green);}.tag-family{background:#fff0f4;color:#c43d5c;}
  .tag-ops{background:#fce8e8;color:#8b2020;}
  .celebration{display:none;background:linear-gradient(135deg,#fdf8e8,#fef3e2);border:2px solid var(--gold);border-radius:14px;padding:20px 22px;text-align:center;margin-top:20px;animation:popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);}
  .celebration.show{display:block;}
  .celebration .cel-emoji{font-size:2rem;margin-bottom:8px;}
  .celebration .cel-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--gold);margin-bottom:6px;}
  .celebration .cel-note{font-size:0.75rem;color:#7a5c10;line-height:1.6;}
  .reset-btn{display:block;margin:20px auto 0;background:transparent;border:1px solid var(--warm);border-radius:8px;padding:8px 20px;font-family:'Nunito',sans-serif;font-size:0.68rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all 0.2s;letter-spacing:0.06em;}
  .reset-btn:hover{background:var(--warm2);color:var(--ink);}
  @keyframes popIn{from{opacity:0;transform:scale(0.9) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .day-off{background:var(--paper);border-radius:14px;border:1px solid var(--warm);padding:40px 24px;text-align:center;box-shadow:var(--shadow);}
  .day-off .off-emoji{font-size:2.5rem;margin-bottom:12px;}
  .day-off .off-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--ink);margin-bottom:8px;}
  .day-off .off-title em{font-style:italic;color:var(--accent);}
  .day-off p{font-size:0.78rem;color:var(--muted);line-height:1.7;max-width:380px;margin:0 auto;}
</style>
</head>

const encouragements = ["Great start! Keep going 💪","You're building momentum! ✨","Halfway there — amazing 🌟","More than halfway! Keep checking! 🎯","Almost there — finish strong! 🔥","SO close! One more! 💛","🎉 DAY COMPLETE! You showed up today.","Every check is a win.","You're doing better than you think. 🙏"];
const dayOrder = ['mon','tue','wed','thu','fri','sat','sun'];
const dayLabels = {mon:'Mon',tue:'Tue',wed:'Wed',thu:'Thu',fri:'Fri',sat:'Sat',sun:'Sun'};

let state = JSON.parse(localStorage.getItem('karen_checklist') || '{}');
let currentDay = null;

function hasSync(){ return !!(window.google && google.script && google.script.run); }
function setBadge(cls, text){ const b=document.getElementById('syncBadge'); if(!b) return; b.className='sync-badge '+cls; b.textContent=text; }

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function getTodayKey(){ const d=new Date().getDay(); const map=[6,0,1,2,3,4,5]; return dayOrder[map[d]]; }
function getAllItems(dayKey){ const day=days[dayKey]; if(!day) return []; const items=[]; day.sections.forEach((sec,si)=>{ sec.items.forEach((item,ii)=>{ items.push(`${dayKey}_${si}_${ii}`); }); }); return items; }
function getProgress(dayKey){ const all=getAllItems(dayKey); const done=all.filter(k=>state[k]).length; return {done,total:all.length}; }

function renderDaySelector(){ const sel=document.getElementById('daySelector'); sel.innerHTML=''; dayOrder.forEach(key=>{ const {done,total}=getProgress(key); const btn=document.createElement('button'); btn.className='day-btn'+(key===currentDay?' active':''); btn.innerHTML=`<span class="day-name">${dayLabels[key]}</span><span class="day-progress">${done}/${total}</span>`; btn.onclick=()=>switchDay(key); sel.appendChild(btn); }); }

function renderProgress(dayKey){ const {done,total}=getProgress(dayKey); document.getElementById('progressCount').textContent=`${done} / ${total}`; const pct=total>0?(done/total)*100:0; document.getElementById('progressBar').style.width=pct+'%'; let msg=''; if(done===0) msg="Ready when you are. Start with the first checkbox. 🌅"; else if(done===total&&total>0) msg="🎉 DAY COMPLETE! You showed up for yourself today."; else { const idx=Math.floor((done/total)*(encouragements.length-2)); msg=encouragements[idx]||encouragements[0]; } document.getElementById('encouragement').textContent=msg; }

function renderDay(dayKey){ const day=days[dayKey]; const container=document.getElementById('dayContent'); container.innerHTML='';
  if(day.isRestDay){ const card=document.createElement('div'); card.className='day-off'; card.innerHTML=`<div class="off-emoji">🌿</div><div class="off-title">Sunday — <em>Full Rest.</em></div><p>${day.restMessage}<br><br>${day.restSub}</p>`; container.appendChild(card); }
  day.sections.forEach((sec,si)=>{ const group=document.createElement('div'); group.className='section-group'; const titleEl=document.createElement('div'); titleEl.className=`section-title s-${sec.type}`; titleEl.innerHTML=`<div class="s-icon">${sec.icon}</div><div class="s-label">${sec.label}</div><div class="s-time">${sec.time}</div>`; group.appendChild(titleEl); const checklist=document.createElement('div'); checklist.className='checklist';
    sec.items.forEach((item,ii)=>{ const key=`${dayKey}_${si}_${ii}`; const isDone=!!state[key]; const el=document.createElement('div'); el.className='check-item'+(isDone?' done':''); el.setAttribute('data-key',key); let tagHtml=''; if(item.tag){ const tagLabels={biz1:'Krafted Charms',biz2:'Bloom Catalyst',health:'Health',family:'Family',ops:'Ops'}; tagHtml=`<span class="check-tag tag-${item.tag}">${tagLabels[item.tag]||item.tag}</span>`; } el.innerHTML=`<div class="checkbox"><span class="checkbox-check">✓</span></div><div class="check-content"><span class="check-time">${item.time}</span><div class="check-title">${tagHtml}${item.title}</div>${item.note?`<div class="check-note">${item.note}</div>`:''}</div>`; el.onclick=()=>toggleItem(key,el,dayKey); checklist.appendChild(el); });
    group.appendChild(checklist); container.appendChild(group); });
  const {done,total}=getProgress(dayKey); const cel=document.createElement('div'); cel.className='celebration'+(done===total&&total>0?' show':''); cel.id='celebration'; cel.innerHTML=`<div class="cel-emoji">🎉</div><div class="cel-title">Day Complete, Karen!</div><div class="cel-note">Every checkbox today was a choice to show up — for your health, your businesses, and your family. Rest well tonight. 🙏</div>`; container.appendChild(cel);
  const resetBtn=document.createElement('button'); resetBtn.className='reset-btn'; resetBtn.textContent="Reset today's checklist"; resetBtn.onclick=()=>resetDay(dayKey); container.appendChild(resetBtn); }

function toggleItem(key,el,dayKey){ state[key]=!state[key]; el.classList.toggle('done',state[key]); localStorage.setItem('karen_checklist',JSON.stringify(state)); renderProgress(dayKey); renderDaySelector(); const {done,total}=getProgress(dayKey); const cel=document.getElementById('celebration'); if(cel) cel.classList.toggle('show',done===total&&total>0); syncCheck(key,dayKey,state[key]); }

function syncCheck(key,dayKey,checked){ if(!hasSync()){ setBadge('offline','offline'); return; } try{ const parts=key.split('_'); const si=+parts[1], ii=+parts[2]; const sec=days[dayKey].sections[si]; const item=sec.items[ii]; setBadge('saving','saving…'); google.script.run.withSuccessHandler(()=>setBadge('saved','synced ✓')).withFailureHandler(()=>setBadge('error','sync failed')).logCheck({ date:todayStr(), day:days[dayKey].name, itemKey:key, title:item.title, checked:checked, tag:item.tag||'' }); }catch(e){ setBadge('error','sync failed'); } }

function resetDay(dayKey){ getAllItems(dayKey).forEach(k=>delete state[k]); localStorage.setItem('karen_checklist',JSON.stringify(state)); renderDay(dayKey); renderProgress(dayKey); renderDaySelector(); }
function switchDay(dayKey){ currentDay=dayKey; renderDaySelector(); renderDay(dayKey); renderProgress(dayKey); }

currentDay=getTodayKey();
renderDaySelector(); renderDay(currentDay); renderProgress(currentDay);
setBadge(hasSync()?'saved':'offline', hasSync()?'sync ready':'offline');
</script>
